  <title>Document</title>
  <!-- 瀑布流效果 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .col-flex {
      gap: 16px;
      display: flex;
      width: 1180px;
      margin: 20px auto;
      /* border: 1px solid red; */

    }

    .col-flex .item {
      flex: 1;
    }

    .col-flex .item a {
      /* 溢出隐藏 */
      overflow: hidden;
      display: block;
      width: 100%;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    .col-flex .item a img {
      /* 修改图片下空白缝隙，改成块级元素（小米） */
      /* display: block; */
      /* 只要不是baseline，就不会有空白缝隙 */
      /* vertical-align: middle; */
      vertical-align: top;
      /* vertical-align: bottom; */
      /* vertical-align: baseline; */
      width: 100%;
    }
  </style>
</head>
