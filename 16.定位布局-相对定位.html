<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box1 {
      /* 给元素添加相对定位 */
      /* 相对于自身原来位置移动，不脱离正常流，元素原位置仍被保留，其他元素按原位置布局排列 */
      /* 属性top, left, bottom, right (优先级top>bottom, left>right) */
      position: relative;
      top: 100px;
      left: 100px;
      width: 200px;
      height: 200px;
      background-color: pink;
    }

    .box2 {
      width: 200px;
      height: 200px;
      background-color: skyblue;
    }
  </style>
</head>

<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>

</html>
