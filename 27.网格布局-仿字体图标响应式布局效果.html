<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      display: grid;
      /* 自动填充设置了最小值100px */
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
      /* 最大宽度1350，但我们可以变小 */
      max-width: 1350px;
      margin: 30px auto;

    }

    .box video {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      ;
    }
  </style>
</head>

<body>
  <div class="box">
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>
    <video src="./img(2)/video.mp4" controls></video>

  </div>
</body>

</html>
