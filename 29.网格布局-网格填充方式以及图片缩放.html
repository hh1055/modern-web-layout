<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      /* 修改网格填充方式 （默认为row)*/
      /* column是按列填充，row是按行填充 */
      grid-auto-flow: column;
      gap: 20px;
      max-width: 1760px;
      height: 900px;
      margin: 100px auto;
      border-radius: 20px;
    }

    .box img {
      display: block;
      width: 100%;
      height: 100%;
      /* object-fit是css中控制外部资源元素（图片、视频、音频等）如何适应其容器尺寸的属性，用object-position来控制图片在容器中的位置 */
      /* fill默认值，拉伸内容以完全填充容器，不保持宽高比，可能导致内容变形 */
      /* contain保持内容固有宽高比，缩放至完全适应容器内部（内容全部可见），容器可能有空白 */
      /* cover保持内容固有宽高比，缩放至覆盖容器，内容可能被裁剪，容器无空白 */
      /* object-fit: contain; */
      /* object-fit: cover; */
      object-position: center;
    }

    .box .item {
      background-color: pink;
    }

    .box .item:first-child {
      grid-row: 1 / 3;
    }

    .box .item:nth-child(3) {
      grid-column: 2 / 4;
      grid-row: 2 / 3;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item">
      <img src="./img(2)/tree1.jpg" alt="">
    </div>
    <div class="item">
      <img src="./img(2)/tree2.jpg" alt="">
    </div>
    <div class="item">
      <img src="./img(2)/tree3.jpg" alt="">
    </div>
    <div class="item">
      <img src="./img(2)/tree4.jpg" alt="">
    </div>
  </div>
</body>

</html>
